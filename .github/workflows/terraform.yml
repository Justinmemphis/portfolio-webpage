name: Terraform

on:
  push:
    branches: [main]
    paths:
      - 'devops-portfolio/terraform/**'
  pull_request:
    branches: [main]
    paths:
      - 'devops-portfolio/terraform/**'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  terraform-checks:
    name: Terraform - Format, Validate, Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devops-portfolio/terraform

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: hashicorp/setup-terraform@v3.1.2

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init (no backend)
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: arn:aws:iam::010955985414:role/devops-portfolio-github-actions-ci
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -var-file=ci.tfvars -no-color -input=false
